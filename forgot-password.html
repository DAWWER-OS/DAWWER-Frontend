<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة المرور - دوّر</title>
  <link rel="icon" type="image/png" href="assets/images/favicon-dawwer.png">

  <!-- الخط العربي -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- الوضع الليلي لمنع الوميض -->
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <link rel="stylesheet" href="css/output.css?v=5.0">
  <style>
    @media (max-width: 1023px) {
      .auth-right-half {
        width: 100vw !important;
        padding: 40px 24px !important;
      }
    }
  </style>
</head>

<body class="m-0 p-0 w-full min-h-screen font-sans bg-[#fcfbf9] text-slate-800" style="margin: 0; padding: 0; width: 100vw; overflow-x: hidden;">

  <div class="w-full min-h-screen flex flex-col-reverse lg:flex-row bg-[#fcfbf9]" dir="ltr">

    <!-- LEFT: Image Section (Desktop Left) -->
    <div class="w-full lg:w-1/2 relative min-h-screen overflow-hidden">
      <img 
        src="assests/image/Image par.jpeg" 
        alt="متجر دوّر" 
        class="absolute inset-0 w-full h-full object-cover object-left"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: left center;"
        onerror="this.src='assets/images/Image.png'"
      >
      <div class="absolute inset-0 bg-[#163828]/25 mix-blend-multiply"></div>
      <div class="absolute top-8 left-8 z-20">
        <img src="assets/images/FrameLogo.png" alt="دوّر" class="h-14 w-auto drop-shadow-md">
      </div>
      <!-- Floating Glass Badge -->
      <div class="absolute top-[16%] left-1/2 -translate-x-1/2 z-20 w-80 sm:w-96 bg-black/40 backdrop-blur-md border border-white/30 rounded-2xl p-6 text-center text-white pointer-events-none shadow-2xl" style="top: 16%; left: 50%; transform: translateX(-50%); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
        <h2 class="text-2xl sm:text-3xl font-extrabold mb-2 tracking-wide drop-shadow-md text-white">استعادة الحساب</h2>
        <p class="text-sm sm:text-base text-white leading-relaxed font-medium drop-shadow-sm">أدخل بريدك المسجل وسنرسل لك<br>تعليمات إعادة تعيين كلمة المرور</p>
      </div>
    </div>

    <!-- RIGHT: Form Section (Desktop Right) -->
    <div class="w-full lg:w-1/2 min-h-screen flex items-center justify-center bg-[#fcfbf9] px-6 sm:px-10 lg:px-12" style="width: 50vw; min-height: 100vh; display: flex; align-items: center; justify-content: center; box-sizing: border-box;" dir="rtl">
      <div style="width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box;">

        <!-- شعار الموبايل فقط -->
        <div class="flex justify-center mb-6 lg:hidden">
          <img src="assets/images/FrameLogo.png" alt="شعار دوّر" class="h-12 w-auto">
        </div>

        <!-- رأس النموذج -->
        <div class="text-right w-full">
          <h1 class="text-3xl sm:text-4xl font-extrabold text-[#21543d] dark:text-emerald-400 mb-2 tracking-tight text-right">نسيت كلمة المرور؟</h1>
          <p class="text-slate-400 dark:text-slate-400 text-sm sm:text-base mb-6 text-right">لا تقلق، سنساعدك في استعادة الوصول لمتجرك</p>
        </div>

        <!-- رسائل التنبيه -->
        <div id="alert-message" class="hidden mb-4 p-3.5 rounded-xl text-sm font-bold"></div>
        <div id="error-message"
          class="hidden mb-4 p-3.5 rounded-2xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-sm font-bold">
        </div>
        <div id="success-message"
          class="hidden mb-4 p-3.5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-[#21543d] dark:text-emerald-300 text-sm font-bold">
        </div>

        <form id="forgot-form" class="w-full space-y-5" style="width: 100%; display: block;">

          <!-- حقل البريد الإلكتروني -->
          <div style="width: 100%; display: block;">
            <label class="block text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 mb-1.5 text-right" for="email-input">البريد الالكتروني</label>
            <div class="relative" style="width: 100%; position: relative;">
              <input type="email" id="email-input"
                class="w-full border border-[#dcdad5] dark:border-slate-700 rounded-2xl bg-transparent dark:bg-slate-900 text-sm text-slate-800 dark:text-slate-100 placeholder:text-slate-400 focus:outline-none focus:border-[#21543d] dark:focus:border-emerald-500 transition"
                style="width: 100%; box-sizing: border-box; padding: 14px 18px 14px 48px; border-radius: 16px; border: 1.5px solid #dcdad5; font-size: 14px;"
                placeholder="أدخل بريدك الالكتروني" required>
              <!-- أيقونة البريد على اليسار -->
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
              </span>
            </div>
          </div>

          <!-- زر الإرسال الأساسي -->
          <button type="submit" id="submit-btn"
            class="w-full bg-[#21543d] hover:bg-[#183f2e] text-white font-bold py-3.5 rounded-2xl shadow-md text-base transition duration-150 cursor-pointer"
            style="width: 100%;">
            إرسال رابط الاستعادة
          </button>

          <!-- خط فاصل -->
          <div class="relative flex items-center justify-center my-4" style="width: 100%;">
            <div class="border-t border-[#e5e3de] dark:border-slate-800 w-full"></div>
            <span class="bg-[#fcfbf9] dark:bg-slate-950 px-3 text-xs text-slate-400">أو</span>
            <div class="border-t border-[#e5e3de] dark:border-slate-800 w-full"></div>
          </div>

          <!-- زر العودة لتسجيل الدخول -->
          <a href="login.html"
            class="w-full block text-center border border-[#cfd6d1] dark:border-slate-700 text-[#21543d] dark:text-emerald-400 font-bold py-3 rounded-2xl text-base hover:bg-slate-50 dark:hover:bg-slate-900 transition duration-150"
            style="width: 100%;">
            العودة إلى تسجيل الدخول
          </a>

        </form>

      </div>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/forgot-password.js"></script>
</body>

</html>
