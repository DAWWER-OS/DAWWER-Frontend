<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختر المتجر للمتابعة - دوّر</title>
  <link rel="icon" type="image/png" href="assets/images/favicon-dawwer.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-[#f8f6f0] font-sans text-slate-800 min-h-screen flex flex-col justify-between antialiased">

  <!-- Header minimal brand bar -->
  <header class="w-full py-4 px-6 sm:px-10 flex justify-between items-center border-b border-slate-200/60 bg-white/70 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <img src="assets/images/FrameLogo.png" alt="شعار دوّر" class="h-8 w-auto object-contain" style="max-height: 32px; object-fit: contain;">
      <span class="text-sm font-bold text-[#1c5335]">بوابة التاجر</span>
    </div>
    <div class="flex items-center gap-3">
      <span id="user-greeting" class="text-xs font-semibold text-slate-600 hidden sm:inline-block"></span>
      <button id="logout-btn" data-action="logout" type="button" class="text-xs bg-red-50 hover:bg-red-100 text-red-700 font-bold px-3 py-1.5 rounded-xl border border-red-200/80 transition cursor-pointer">
        تسجيل الخروج
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-8">
    <div class="w-full max-w-2xl bg-white p-6 sm:p-10 rounded-3xl shadow-sm border border-slate-100">
      
      <!-- Top Branding & Titles -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#edf5f0] text-[#1c5335] mb-4 shadow-2xs">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-[#1c5335] mb-2">اختر المتجر للمتابعة</h1>
        <p class="text-slate-500 text-sm max-w-md mx-auto">حدد المتجر أو الفرع الذي ترغب في إدارته الآن للوصول إلى لوحة التحكم والكتالوج الذكي.</p>
      </div>

      <!-- Error / Alert Message -->
      <div id="error-message" class="hidden mb-6 p-4 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-sm font-bold leading-relaxed"></div>

      <!-- Stores Grid -->
      <div id="stores-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
        <!-- Skeleton loaders rendered by default -->
        <div class="animate-pulse p-5 rounded-2xl border border-slate-200 bg-slate-50/60 flex flex-col justify-between h-36">
          <div class="space-y-3">
            <div class="h-4 bg-slate-200 rounded-md w-3/4"></div>
            <div class="h-3 bg-slate-200 rounded-md w-1/2"></div>
          </div>
          <div class="flex justify-between items-center pt-2">
            <div class="h-5 bg-slate-200 rounded-full w-16"></div>
            <div class="h-4 w-4 bg-slate-200 rounded-full"></div>
          </div>
        </div>
        <div class="animate-pulse p-5 rounded-2xl border border-slate-200 bg-slate-50/60 flex flex-col justify-between h-36">
          <div class="space-y-3">
            <div class="h-4 bg-slate-200 rounded-md w-2/3"></div>
            <div class="h-3 bg-slate-200 rounded-md w-1/3"></div>
          </div>
          <div class="flex justify-between items-center pt-2">
            <div class="h-5 bg-slate-200 rounded-full w-16"></div>
            <div class="h-4 w-4 bg-slate-200 rounded-full"></div>
          </div>
        </div>
      </div>

      <!-- Action Card / Add New Store -->
      <div class="pt-2 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
        <a href="merchant-application.html" id="add-store-btn" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl border-2 border-dashed border-[#1c5335]/40 hover:border-[#1c5335] text-[#1c5335] bg-[#edf5f0]/40 hover:bg-[#edf5f0] text-sm font-bold transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          <span>+ إضافة متجر جديد</span>
        </a>

        <button data-action="logout" type="button" class="text-xs text-slate-500 hover:text-red-700 transition font-semibold underline cursor-pointer py-1">
          تسجيل الخروج بحساب آخر
        </button>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-4 text-center text-xs text-slate-400">
    منصة دوّر © جميع الحقوق محفوظة لشركاء النجاح
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/main.js"></script>
  <script src="js/select-store.js"></script>
</body>
</html>
