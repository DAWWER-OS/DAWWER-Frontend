<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختر المتجر للمتابعة - دوّر</title>
  <link rel="icon" type="image/png" href="assets/images/favicon-dawwer.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link rel="stylesheet" href="css/output.css">
  <script src="js/theme.js"></script>
  <script>
    (function() {
      try {
        const candidateKeys = ['accessToken', 'token', 'access_token', 'dawwer_access_token'];
        let token = null;
        for (const k of candidateKeys) {
          const v = localStorage.getItem(k);
          if (v && v.trim() && v !== 'null' && v !== 'undefined') { token = v.trim(); break; }
        }
        if (!token) return;

        let role = localStorage.getItem('userRole') || localStorage.getItem('role');
        if (!role) {
          const rawUser = localStorage.getItem('userData') || localStorage.getItem('dawwer_user_data') || localStorage.getItem('user');
          if (rawUser) {
            const u = JSON.parse(rawUser);
            role = u.role ?? u.Role;
          }
        }
        if (!role && token.includes('.')) {
          const parts = token.split('.');
          if (parts.length === 3) {
            const payload = JSON.parse(decodeURIComponent(escape(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')))));
            role = payload['http://schemas.microsoft.com/ws/2008/06/identity/claims/role'] ||
                   payload['http://schemas.microsoft.com/ws/2008/06/identity/claims/roles'] ||
                   payload.role || payload.roles;
          }
        }
        const rStr = Array.isArray(role) ? role.join(',') : String(role || '');
        if (rStr === '4' || /admin|superadmin/i.test(rStr)) {
          window.location.replace('admin-dashboard.html');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between antialiased transition-colors duration-200">

  <!-- Header minimal brand bar -->
  <header class="w-full py-4 px-6 sm:px-10 flex justify-between items-center border-b border-slate-200/60 bg-white/70 dark:bg-slate-900/90 backdrop-blur-md dark:border-slate-800">
    <div class="flex items-center gap-3">
      <img src="assets/images/FrameLogo.png" alt="شعار دوّر" class="h-8 w-auto object-contain" style="max-height: 32px; object-fit: contain;">
      <span class="text-sm font-bold text-[#1c5335]">بوابة التاجر</span>
    </div>
    <div class="flex items-center gap-3">
      <span id="user-greeting" class="text-xs font-semibold text-slate-600 hidden sm:inline-block"></span>
            <!-- زر تبديل الوضع الليلي -->
      <button id="theme-toggle-btn" type="button" aria-label="تبديل الوضع الليلي" class="p-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-amber-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors shadow-sm focus:outline-none cursor-pointer active:scale-95">
        <!-- Moon Icon (shown in Light Mode) -->
        <svg id="theme-moon-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <!-- Sun Icon (shown in Dark Mode) -->
        <svg id="theme-sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
      </button>
      <button id="logout-btn" data-action="logout" type="button" class="text-xs bg-red-50 hover:bg-red-100 text-red-700 font-bold px-3 py-1.5 rounded-xl border border-red-200/80 transition cursor-pointer">
        تسجيل الخروج

    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-8">
    <div class="w-full max-w-2xl bg-white p-6 sm:p-10 rounded-3xl shadow-sm border border-slate-100 dark:bg-slate-900 dark:border-slate-800">
      
      <!-- Top Branding & Titles -->

        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-[#1c5335] mb-2">اختر المتجر للمتابعة</h1>

      <!-- Error / Alert Message -->

      <!-- Stores Grid -->

        <div class="animate-pulse p-5 rounded-2xl border border-slate-200 bg-slate-50/60 flex flex-col justify-between h-36">

            <div class="h-4 bg-slate-200 rounded-md w-3/4"></div>
            <div class="h-3 bg-slate-200 rounded-md w-1/2"></div>
          </div>
          <div class="flex justify-between items-center pt-2">
            <div class="h-5 bg-slate-200 rounded-full w-16"></div>
            <div class="h-4 w-4 bg-slate-200 rounded-full"></div>
          </div>
        </div>
        <div class="animate-pulse p-5 rounded-2xl border border-slate-200 bg-slate-50/60 flex flex-col justify-between h-36">
          <div class="space-y-3">
            <div class="h-4 bg-slate-200 rounded-md w-2/3"></div>
            <div class="h-3 bg-slate-200 rounded-md w-1/3"></div>
          </div>
          <div class="flex justify-between items-center pt-2">
            <div class="h-5 bg-slate-200 rounded-full w-16"></div>
            <div class="h-4 w-4 bg-slate-200 rounded-full"></div>
          </div>
        </div>
      </div>

      <!-- Action Card / Add New Store -->
      <div class="pt-2 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
        <a href="merchant-application.html" id="add-store-btn" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl border-2 border-dashed border-[#1c5335]/40 hover:border-[#1c5335] text-[#1c5335] bg-[#edf5f0]/40 hover:bg-[#edf5f0] text-sm font-bold transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          <span>+ إضافة متجر جديد</span>
        </a>

        <button data-action="logout" type="button" class="text-xs text-slate-500 hover:text-red-700 transition font-semibold underline cursor-pointer py-1">
          تسجيل الخروج بحساب آخر
        </button>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-4 text-center text-xs text-slate-400">
    منصة دوّر © جميع الحقوق محفوظة لشركاء النجاح
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/main.js"></script>
  <script src="js/select-store.js"></script>
</body>
</html>
