<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي والحساب - دوّر</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <script src="assets/css/tailwind.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#1c5335',
              dark: '#143e27',
              soft: '#edf5f0'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f8f6f0] font-['Tajawal',sans-serif] text-slate-800 min-h-screen">

  <div class="flex min-h-screen">

    <!-- Mobile Drawer Backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden"></div>

    <!-- Sidebar Navigation -->
    <div class="w-64 bg-gradient-to-b from-[#143e27] to-[#1c5335] text-white p-6 hidden md:block" id="sidebar-box">
      <div class="text-center mb-8">
        <div class="flex justify-center mb-3">
          <img src="assets/images/FrameLogo.png" alt="شعار دوّر" class="h-10 w-auto">
        </div>
        <div class="text-sm font-bold text-white">لوحة تحكم دوّر</div>
      </div>

      <div class="bg-white/10 p-4 rounded-xl mb-6 text-center border border-white/5">
        <div class="text-sm font-bold text-white mb-1" data-user-name>جاري التحميل...</div>
        <div class="text-xs text-white/80" data-user-role>مستخدم المنظومة</div>
      </div>

      <div class="flex flex-col gap-2 sidebar-nav">
        <a href="index.html" class="flex items-center justify-between p-3 rounded-xl text-white hover:bg-white/10 font-medium transition">
          <span>نظرة عامة</span>
        </a>
        <a href="products.html" class="flex items-center justify-between p-3 rounded-xl text-white hover:bg-white/10 font-medium transition">
          <span>المنتجات</span>
        </a>
        <a href="add-product.html" class="flex items-center justify-between p-3 rounded-xl text-white hover:bg-white/10 font-medium transition">
          <span>إضافة منتج</span>
        </a>
        <a href="orders.html" class="flex items-center justify-between p-3 rounded-xl text-white hover:bg-white/10 font-medium transition">
          <span>الطلبات</span>
        </a>
        <a href="shelves.html" class="flex items-center justify-between p-3 rounded-xl text-white hover:bg-white/10 font-medium transition">
          <span>مواقع الممرات</span>
        </a>
        <a href="profile.html" class="flex items-center justify-between p-3 rounded-xl bg-[#143e27] text-white font-bold transition">
          <span>الملف الشخصي</span>
        </a>
      </div>

      <div class="pt-8 mt-12 border-t border-white/20">
        <button onclick="Auth.logout()" class="w-full bg-red-500/20 hover:bg-red-500/30 text-white p-2.5 rounded-xl text-sm font-bold text-center transition">
          تسجيل الخروج
        </button>
      </div>
    </div>

    <!-- Main Workspace -->
    <div class="flex-1 p-6 md:p-8">
      
      <!-- Top Mobile & Page Header -->
      <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-200">
        <div class="flex items-center gap-3">
          <button id="mobile-menu-btn" class="p-2 rounded-xl bg-white border border-slate-200 text-[#1c5335] md:hidden">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
          <img src="assets/images/FrameLogo.png" alt="شعار دوّر" class="h-8 w-auto md:hidden">
          <div>
            <h1 class="text-xl md:text-2xl font-bold text-[#1c5335]">الملف الشخصي والحساب</h1>
            <p class="text-xs text-slate-500 mt-0.5">إدارة بيانات حسابك وكلمة المرور</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="Auth.logout()" class="text-xs bg-white border border-slate-300 px-3 py-2 rounded-xl text-slate-700 font-bold hover:bg-slate-50">
            تسجيل الخروج
          </button>
        </div>
      </div>

      <div id="profile-alert" class="hidden mb-6 p-4 rounded-2xl text-sm font-bold"></div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-5xl">
        
        <!-- User Information Form -->
        <div class="lg:col-span-6 bg-white p-6 sm:p-8 rounded-2xl border border-slate-100 shadow-sm">
          <h2 class="text-lg font-bold text-[#1c5335] mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
            <span>بيانات الحساب</span>
          </h2>

          <form id="profile-form" onsubmit="handleUpdateProfile(event)" class="flex flex-col gap-4">
            <div>
              <label class="block text-sm font-bold text-slate-700 mb-1" for="full-name-input">الاسم الكامل</label>
              <input 
                type="text" 
                id="full-name-input" 
                required 
                class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:border-[#1c5335] focus:ring-1 focus:ring-[#1c5335] focus:outline-none"
                placeholder="أحمد علي"
              >
            </div>

            <div>
              <label class="block text-sm font-bold text-slate-700 mb-1" for="profile-email-input">البريد الإلكتروني</label>
              <input 
                type="email" 
                id="profile-email-input" 
                required 
                class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:border-[#1c5335] focus:ring-1 focus:ring-[#1c5335] focus:outline-none"
                placeholder="name@example.com"
              >
            </div>

            <div>
              <label class="block text-sm font-bold text-slate-700 mb-1" for="profile-phone-input">رقم الهاتف</label>
              <input 
                type="tel" 
                id="profile-phone-input" 
                class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:border-[#1c5335] focus:ring-1 focus:ring-[#1c5335] focus:outline-none"
                placeholder="+966500000000"
              >
            </div>

            <button type="submit" id="save-profile-btn" class="w-full bg-[#1c5335] hover:bg-[#143e27] text-white font-bold p-3.5 rounded-xl shadow text-sm transition mt-2">
              حفظ بيانات الملف الشخصي
            </button>
          </form>
        </div>

        <!-- Security / Password Change Form -->
        <div class="lg:col-span-6 bg-white p-6 sm:p-8 rounded-2xl border border-slate-100 shadow-sm">
          <h2 class="text-lg font-bold text-[#1c5335] mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
            <span>الأمان وكلمة المرور</span>
          </h2>

          <form id="password-form" onsubmit="handleChangePassword(event)" class="flex flex-col gap-4">
            <div>
              <label class="block text-sm font-bold text-slate-700 mb-1" for="current-pass-input">كلمة المرور الحالية</label>
              <input 
                type="password" 
                id="current-pass-input" 
                required 
                class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:border-[#1c5335] focus:ring-1 focus:ring-[#1c5335] focus:outline-none"
                placeholder="••••••••"
              >
            </div>

            <div>
              <label class="block text-sm font-bold text-slate-700 mb-1" for="new-pass-input">كلمة المرور الجديدة</label>
              <input 
                type="password" 
                id="new-pass-input" 
                required 
                class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:border-[#1c5335] focus:ring-1 focus:ring-[#1c5335] focus:outline-none"
                placeholder="••••••••"
              >
              <p class="text-[11px] text-slate-500 mt-1">يجب ألا تقل عن 8 خانات وتحتوي على أحرف وأرقام ورموز.</p>
            </div>

            <button type="submit" id="save-pass-btn" class="w-full bg-slate-800 text-white font-bold p-3.5 rounded-xl shadow hover:bg-slate-900 text-sm transition mt-2">
              تغيير كلمة المرور
            </button>
          </form>
        </div>

      </div>

    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    // Enforce Route Guard
    Auth.requireAuth();

    async function loadUserProfile() {
      try {
        const res = await ApiClient.get("/Profile");
        if (res && res.data) {
          document.getElementById("full-name-input").value = res.data.fullName || "";
          document.getElementById("profile-email-input").value = res.data.email || "";
          document.getElementById("profile-phone-input").value = res.data.phoneNumber || "";
        }
      } catch (err) {
        console.error("Profile load error:", err);
      }
    }

    async function handleUpdateProfile(event) {
      event.preventDefault();
      const alertBox = document.getElementById("profile-alert");
      const btn = document.getElementById("save-profile-btn");

      alertBox.classList.add("hidden");
      btn.innerText = "جاري الحفظ...";
      btn.disabled = true;

      try {
        const payload = {
          fullName: document.getElementById("full-name-input").value.trim(),
          email: document.getElementById("profile-email-input").value.trim(),
          phoneNumber: document.getElementById("profile-phone-input").value.trim()
        };

        const res = await ApiClient.put("/Profile", payload);
        alertBox.innerHTML = res.message || "تم تحديث الملف الشخصي بنجاح.";
        alertBox.className = "mb-6 p-4 rounded-2xl text-sm font-bold bg-emerald-50 border border-emerald-200 text-emerald-700 block";
        
        // Update local stored user name
        const user = Auth.getUser();
        if (user) {
          user.fullName = payload.fullName;
          user.email = payload.email;
          user.phoneNumber = payload.phoneNumber;
          localStorage.setItem(CONFIG.USER_KEY, JSON.stringify(user));
        }
        initLayout();
      } catch (err) {
        alertBox.innerHTML = err.message;
        alertBox.className = "mb-6 p-4 rounded-2xl text-sm font-bold bg-red-50 border border-red-200 text-red-700 block";
      } finally {
        btn.innerText = "حفظ بيانات الملف الشخصي";
        btn.disabled = false;
      }
    }

    async function handleChangePassword(event) {
      event.preventDefault();
      const alertBox = document.getElementById("profile-alert");
      const btn = document.getElementById("save-pass-btn");

      alertBox.classList.add("hidden");
      btn.innerText = "جاري التحديث...";
      btn.disabled = true;

      try {
        const payload = {
          currentPassword: document.getElementById("current-pass-input").value,
          newPassword: document.getElementById("new-pass-input").value
        };

        const res = await ApiClient.post("/Profile/change-password", payload);
        alertBox.innerHTML = res.message || "تم تغيير كلمة المرور بنجاح! يرجى إعادة تسجيل الدخول.";
        alertBox.className = "mb-6 p-4 rounded-2xl text-sm font-bold bg-emerald-50 border border-emerald-200 text-emerald-700 block";

        setTimeout(() => {
          Auth.logout();
        }, 2000);
      } catch (err) {
        alertBox.innerHTML = err.message;
        alertBox.className = "mb-6 p-4 rounded-2xl text-sm font-bold bg-red-50 border border-red-200 text-red-700 block";
        btn.innerText = "تغيير كلمة المرور";
        btn.disabled = false;
      }
    }

    loadUserProfile();
  </script>
</body>
</html>
